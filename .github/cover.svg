<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14111f"/>
      <stop offset="1" stop-color="#261a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#7843e9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7843e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7843e9"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barHi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Текст -->
  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" fill="#ffffff">
    <text x="88" y="178" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" fill="#a78bfa" letter-spacing="1">tikhomirov/moonshine-yandex-metrika</text>
    <text x="84" y="282" font-size="92" font-weight="800" letter-spacing="-2">MoonShine</text>
    <text x="84" y="384" font-size="92" font-weight="800" letter-spacing="-2">Yandex Metrika</text>
    <text x="88" y="446" font-size="30" font-weight="500" fill="#c4b5fd">Yandex Metrika &amp; Webmaster for MoonShine 5</text>
  </g>

  <!-- Плашки -->
  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#e9e3ff">
    <rect x="88" y="492" width="128" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="152" y="521" text-anchor="middle">Metrika</text>
    <rect x="228" y="492" width="160" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="308" y="521" text-anchor="middle">Webmaster</text>
    <rect x="400" y="492" width="112" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="456" y="521" text-anchor="middle">OAuth</text>
    <rect x="524" y="492" width="92" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="570" y="521" text-anchor="middle">CSV</text>
  </g>

  <!-- График: столбики и линия -->
  <g transform="translate(830 150)">
    <rect x="-24" y="-24" width="400" height="388" rx="28" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g stroke="#ffffff" stroke-opacity="0.08">
      <line x1="10" y1="80" x2="342" y2="80"/>
      <line x1="10" y1="160" x2="342" y2="160"/>
      <line x1="10" y1="240" x2="342" y2="240"/>
      <line x1="10" y1="320" x2="342" y2="320"/>
    </g>
    <rect x="16"  y="220" width="34" height="100" rx="8" fill="url(#bar)"/>
    <rect x="64"  y="180" width="34" height="140" rx="8" fill="url(#bar)"/>
    <rect x="112" y="200" width="34" height="120" rx="8" fill="url(#bar)"/>
    <rect x="160" y="130" width="34" height="190" rx="8" fill="url(#bar)"/>
    <rect x="208" y="150" width="34" height="170" rx="8" fill="url(#bar)"/>
    <rect x="256" y="90"  width="34" height="230" rx="8" fill="url(#bar)"/>
    <rect x="304" y="40"  width="34" height="280" rx="8" fill="url(#barHi)"/>
    <polyline points="33,196 81,156 129,176 177,106 225,126 273,66 321,16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
    <g fill="#ffffff">
      <circle cx="33" cy="196" r="6"/><circle cx="81" cy="156" r="6"/><circle cx="129" cy="176" r="6"/>
      <circle cx="177" cy="106" r="6"/><circle cx="225" cy="126" r="6"/><circle cx="273" cy="66" r="6"/>
      <circle cx="321" cy="16" r="8" fill="#fcd34d"/>
    </g>
  </g>
</svg>
