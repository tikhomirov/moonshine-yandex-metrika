name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        moonshine: ['^4.0']
        exclude:
          - php: '8.2'
            laravel: '13.*'
        include:
          - php: '8.4'
            laravel: '12.*'
            moonshine: '5.x-dev'
          - php: '8.4'
            laravel: '13.*'
            moonshine: '5.x-dev'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - MoonShine ${{ matrix.moonshine }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "moonshine/moonshine:${{ matrix.moonshine }}" --no-update
          # Laravel 11 is EOL: Packagist flags every 11.* release with security
          # advisories, so Composer 2.9+ would refuse the install. Support stays
          # in composer.json; --no-blocking is only used for the 11.* matrix jobs.
          if [[ "${{ matrix.laravel }}" == 11.* ]]; then
            composer update --prefer-dist --no-interaction --no-progress --no-blocking
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Run tests
        run: vendor/bin/pest
