name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['12.*', '13.*']
        moonshine: ['^5.0']
        guzzle: ['^7.0']
        include:
          - php: '8.4'
            laravel: '13.*'
            moonshine: '^5.0'
            guzzle: '^8.0'

    name: test · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Guzzle ${{ matrix.guzzle }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, sqlite, pcov
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "moonshine/moonshine:${{ matrix.moonshine }}" "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/pest -c phpunit.xml.dist --coverage --min=100

  type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest -c phpunit.xml.dist --type-coverage --min=100

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M

  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, sqlite, pcov
          coverage: pcov
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest -c phpunit.xml.dist --mutate --min=100